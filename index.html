<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHA-HI VOICE STORAGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .playing-glow { animation: pulse-ring 2s infinite ease-in-out; }

        @keyframes flashEffect {
            0% { opacity: 0; transform: scale(0.95); }
            30% { opacity: 0.35; transform: scale(1); }
            70% { opacity: 0.35; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }
        .animate-flash {
            animation: flashEffect 0.35s ease-in-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#f7f5f0] text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">

    <!-- ヘッダー -->
    <header class="border-b border-orange-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md sticky top-0 z-50 shadow-sm transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            
            <div class="flex items-center space-x-6 overflow-x-auto py-2">
                <img src="AchaLogo.png" alt="ACHA-HI ロゴ" class="h-12 w-auto object-contain rounded-2xl shadow-sm flex-shrink-0">
                
                <nav class="hidden md:flex items-center space-x-2 border-l border-orange-200 dark:border-slate-700 pl-6">
                    <span class="text-xs font-bold text-orange-700 dark:text-orange-400 mr-2 flex-shrink-0">ジャンプ:</span>
                    <button onclick="scrollToCategory('日常')" class="px-3 py-1.5 rounded-xl bg-orange-50 hover:bg-orange-500 text-orange-800 hover:text-white dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-orange-600 font-bold text-xs transition-all flex-shrink-0 cursor-pointer">日常</button>
                    <button onclick="scrollToCategory('ゲーム')" class="px-3 py-1.5 rounded-xl bg-orange-50 hover:bg-orange-500 text-orange-800 hover:text-white dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-orange-600 font-bold text-xs transition-all flex-shrink-0 cursor-pointer">ゲーム</button>
                    <button onclick="scrollToCategory('素材')" class="px-3 py-1.5 rounded-xl bg-orange-50 hover:bg-orange-500 text-orange-800 hover:text-white dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-orange-600 font-bold text-xs transition-all flex-shrink-0 cursor-pointer">素材</button>
                </nav>
            </div>

            <div class="flex items-center space-x-4 flex-shrink-0">
                <div class="hidden sm:flex items-center space-x-2 bg-orange-50/80 dark:bg-slate-800/80 border border-orange-200 dark:border-slate-700 px-3 py-1.5 rounded-2xl">
                    <i id="volumeIcon" class="fa-solid fa-volume-high text-orange-600 dark:text-orange-400 text-xs"></i>
                    <input type="range" min="0" max="100" value="100" oninput="changeVolume(this.value)"
                           class="w-20 accent-orange-500 cursor-pointer h-1 bg-orange-200 dark:bg-slate-700 rounded-lg">
                    <span id="volumeText" class="text-xs font-bold text-orange-800 dark:text-orange-300 w-8 text-right">100%</span>
                </div>

                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-2xl bg-orange-100 hover:bg-orange-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-orange-700 dark:text-amber-400 flex items-center justify-center transition-colors shadow-sm cursor-pointer" title="テーマ切り替え">
                    <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- スマホ用カテゴリジャンプ -->
    <div class="flex md:hidden items-center justify-center space-x-2 bg-white dark:bg-slate-900 border-b border-orange-200 dark:border-slate-800 p-3 shadow-sm">
        <span class="text-xs font-bold text-orange-700 dark:text-orange-400 mr-1">ジャンプ:</span>
        <button onclick="scrollToCategory('日常')" class="px-3 py-1 rounded-lg bg-orange-50 text-orange-800 dark:bg-slate-800 dark:text-slate-200 font-bold text-xs">日常</button>
        <button onclick="scrollToCategory('ゲーム')" class="px-3 py-1 rounded-lg bg-orange-50 text-orange-800 dark:bg-slate-800 dark:text-slate-200 font-bold text-xs">ゲーム</button>
        <button onclick="scrollToCategory('素材')" class="px-3 py-1 rounded-lg bg-orange-50 text-orange-800 dark:bg-slate-800 dark:text-slate-200 font-bold text-xs">素材</button>
    </div>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- バナーエリア -->
        <div class="bg-gradient-to-r from-orange-100/70 via-amber-50 to-orange-50 dark:from-slate-900 dark:via-slate-900 dark:to-slate-900 border border-orange-200/80 dark:border-slate-800 rounded-3xl p-6 sm:p-8 flex flex-col md:flex-row items-center justify-between gap-6 shadow-sm transition-colors duration-300">
            <div class="space-y-2 text-center md:text-left">
                <span class="inline-block px-3 py-1 rounded-full bg-orange-500 text-white text-xs font-bold tracking-wide uppercase shadow-sm">VOICE & MEDIA STORAGE</span>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">お気に入りのあちゃーひを手元に</h2>
                <p class="text-slate-700 dark:text-slate-300 text-sm font-medium max-w-xl">
                    音声カードはクリックで再生、画像カードはクリックでプレビュー（拡大表示）が開きます。
                </p>
            </div>
            
            <!-- 総アイテム ＆ 最終更新カウンターボックス -->
            <div class="flex items-center space-x-4 bg-white dark:bg-slate-900 border border-orange-200 dark:border-slate-800 p-4 rounded-2xl shadow-sm">
                <div class="text-center px-3 border-r border-slate-200 dark:border-slate-800">
                    <span id="totalCount" class="block text-2xl font-extrabold text-orange-600 dark:text-orange-400">0</span>
                    <span class="text-xs text-slate-600 dark:text-slate-400 font-semibold">総アイテム</span>
                </div>
                <div class="text-center px-3">
                    <!-- contenteditable="true" を設定しているので、ブラウザ上で直接クリックして文字を書き換えられます -->
                    <span id="updateText" class="block text-sm font-bold text-slate-800 dark:text-slate-200 outline-none hover:bg-orange-50/50 dark:hover:bg-slate-800/50 px-2 py-0.5 rounded transition-colors cursor-text" >09/30 14:00</span>
                    <span class="text-xs text-slate-600 dark:text-slate-400 font-semibold">最終更新</span>
                </div>
            </div>
        </div>

        <!-- カテゴリごとのコンテナ -->
        <div id="categoryContainer" class="space-y-6"></div>

        <!-- 空の状態 -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="w-16 h-16 bg-white dark:bg-slate-900 border border-orange-200 dark:border-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-orange-500 text-2xl shadow-sm">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800 dark:text-slate-200 mb-1">ファイルがありません</h3>
        </div>
    </main>

    <!-- ダークモード切替時に achahi.png, achahi2.png, achahi3.png からランダムで一瞬出現するオーバーレイ -->
    <div id="flashOverlay" class="fixed inset-0 pointer-events-none z-50 flex items-center justify-center overflow-hidden hidden">
        <img id="flashImage" src="" alt="Effect" class="max-w-[70vw] max-h-[70vh] object-contain opacity-0">
    </div>

    <!-- 画像プレビュー用モーダル -->
    <div id="previewModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden" onclick="closePreviewModal()">
        <div class="relative max-w-4xl max-h-[90vh] flex items-center justify-center" onclick="event.stopPropagation()">
            <button onclick="closePreviewModal()" class="absolute -top-12 right-0 w-10 h-10 rounded-full bg-white/90 hover:bg-white text-slate-800 flex items-center justify-center shadow-lg transition-colors cursor-pointer">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <img id="previewImage" src="" alt="プレビュー画像" class="max-w-full max-h-[85vh] w-auto object-contain rounded-2xl shadow-2xl bg-white dark:bg-slate-900 p-2 border border-orange-200 dark:border-slate-800">
        </div>
    </div>

    <!-- フッター -->
    <footer class="border-t border-orange-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 py-6 text-center text-xs font-semibold text-slate-600 dark:text-slate-400 transition-colors duration-300">
        <p>&copy; 2026 ACHA-HI VOICE STORAGE. All rights to Asahi.</p>
    </footer>

    <!-- 外部データ読み込み -->
    <script src="audio_data.js"></script>
    <script>
        const categories = ["日常", "ゲーム", "素材"];
        let audioList = [];
        let currentAudio = null;
        let currentPlayingId = null;
        let currentVolume = 1.0;
        let categoryOpenState = { "日常": true, "ゲーム": true, "素材": true };

        const categoryContainer = document.getElementById('categoryContainer');
        const totalCountEl = document.getElementById('totalCount');
        const emptyStateEl = document.getElementById('emptyState');
        const volumeTextEl = document.getElementById('volumeText');
        const volumeIconEl = document.getElementById('volumeIcon');

        const previewModal = document.getElementById('previewModal');
        const previewImage = document.getElementById('previewImage');
        const themeIcon = document.getElementById('themeIcon');
        const flashOverlay = document.getElementById('flashOverlay');
        const flashImage = document.getElementById('flashImage');

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            themeIcon.className = "fa-solid fa-sun text-sm";
        }

        function toggleDarkMode() {
            const r = Math.random();
            let chosenFile = 'AC_Achahi.png';
            if (r < 0.33) {
                chosenFile = 'AC_Achahi.png';
            } else if (r < 0.66) {
                chosenFile = 'AC_Ayaya.png';
            } else {
                chosenFile = 'AC_Kami.png';
            }

            flashImage.src = chosenFile;

            flashOverlay.classList.remove('hidden');
            flashImage.classList.remove('animate-flash');
            void flashImage.offsetWidth;
            flashImage.classList.add('animate-flash');

            setTimeout(() => {
                flashOverlay.classList.add('hidden');
            }, 350);

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.className = "fa-solid fa-moon text-sm";
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.className = "fa-solid fa-sun text-sm";
            }
        }

        function loadAudios() {
            audioList = (typeof window.audioVaultData !== 'undefined') ? window.audioVaultData : [];
        }

        function toggleCategory(catName) {
            categoryOpenState[catName] = !categoryOpenState[catName];
            renderCategories();
        }

        function scrollToCategory(catName) {
            if (!categoryOpenState[catName]) {
                categoryOpenState[catName] = true;
                renderCategories();
            }
            setTimeout(() => {
                const targetEl = document.getElementById(`section-${catName}`);
                if (targetEl) {
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, 50);
        }

        function changeVolume(value) {
            currentVolume = value / 100;
            const percentText = value + '%';
            if (volumeTextEl) volumeTextEl.textContent = percentText;

            if (volumeIconEl) {
                if (value == 0) {
                    volumeIconEl.className = "fa-solid fa-volume-xmark text-rose-500";
                } else if (value < 50) {
                    volumeIconEl.className = "fa-solid fa-volume-low text-orange-600 dark:text-orange-400";
                } else {
                    volumeIconEl.className = "fa-solid fa-volume-high text-orange-600 dark:text-orange-400";
                }
            }

            if (currentAudio) {
                currentAudio.volume = currentVolume;
            }
        }

        function handleCardClick(item) {
            if (item.type === 'image') {
                openPreviewModal(item);
            } else {
                togglePlay(item.id);
            }
        }

        function openPreviewModal(item) {
            previewImage.src = item.filename;
            previewModal.classList.remove('hidden');
        }

        function closePreviewModal() {
            previewModal.classList.add('hidden');
        }

        function getCategoryTheme(cat) {
            switch(cat) {
                case '日常':
                    return {
                        folderBg: 'bg-orange-100 dark:bg-slate-800 text-orange-700 dark:text-orange-400 group-hover:bg-orange-500',
                        badge: 'bg-orange-50 dark:bg-orange-950/40 text-orange-800 dark:text-orange-300 border-orange-200 dark:border-orange-900'
                    };
                case 'ゲーム':
                    return {
                        folderBg: 'bg-sky-100 dark:bg-slate-800 text-sky-700 dark:text-sky-400 group-hover:bg-sky-500',
                        badge: 'bg-sky-50 dark:bg-sky-950/40 text-sky-800 dark:text-sky-300 border-sky-200 dark:border-sky-900'
                    };
                case '素材':
                    return {
                        folderBg: 'bg-purple-100 dark:bg-slate-800 text-purple-700 dark:text-purple-400 group-hover:bg-purple-500',
                        badge: 'bg-purple-50 dark:bg-purple-950/40 text-purple-800 dark:text-purple-300 border-purple-200 dark:border-purple-900'
                    };
                default:
                    return {
                        folderBg: 'bg-orange-100 dark:bg-slate-800 text-orange-700 dark:text-orange-400 group-hover:bg-orange-500',
                        badge: 'bg-orange-50 dark:bg-slate-800 text-orange-800 dark:text-orange-300 border-orange-200 dark:border-slate-700'
                    };
            }
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            totalCountEl.textContent = audioList.length;

            if (audioList.length === 0) {
                emptyStateEl.classList.remove('hidden');
                return;
            } else {
                emptyStateEl.classList.add('hidden');
            }

            categories.forEach(cat => {
                const itemsInCat = audioList.filter(item => item.category === cat);
                const isOpen = categoryOpenState[cat];
                const theme = getCategoryTheme(cat);

                const section = document.createElement('div');
                section.id = `section-${cat}`;
                section.className = "bg-white dark:bg-slate-900 border border-orange-200/90 dark:border-slate-800 rounded-3xl p-6 shadow-sm transition-all scroll-mt-28";

                section.innerHTML = `
                    <div onclick="toggleCategory('${cat}')" class="flex items-center justify-between cursor-pointer select-none group">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-2xl ${theme.folderBg} flex items-center justify-center font-bold text-sm shadow-sm group-hover:text-white transition-colors">
                                <i class="fa-solid fa-folder-open"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900 dark:text-white group-hover:text-orange-600 dark:group-hover:text-orange-400 transition-colors">
                                ${cat} <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 ml-2">(${itemsInCat.length}件)</span>
                            </h3>
                        </div>
                        <button class="w-8 h-8 rounded-full bg-orange-50 dark:bg-slate-800 text-orange-600 dark:text-orange-400 flex items-center justify-center transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </button>
                    </div>

                    <div id="grid-${cat}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6 ${isOpen ? '' : 'hidden'}"></div>
                `;

                categoryContainer.appendChild(section);

                const gridEl = document.getElementById(`grid-${cat}`);

                if (itemsInCat.length === 0) {
                    gridEl.innerHTML = `<p class="text-xs font-medium text-slate-500 dark:text-slate-400 col-span-full py-4 text-center">このカテゴリにはまだファイルがありません。</p>`;
                } else {
                    itemsInCat.forEach((item) => {
                        const isPlaying = currentPlayingId === item.id;
                        const isImage = item.type === 'image';

                        const card = document.createElement('div');
                        card.className = `relative overflow-hidden bg-white dark:bg-slate-900 border ${isPlaying ? 'border-orange-500 shadow-md shadow-orange-500/15 ring-2 ring-orange-200 dark:ring-orange-900' : 'border-orange-200/80 dark:border-slate-800 hover:border-orange-400 dark:hover:border-orange-600 hover:shadow-md'} rounded-3xl p-6 flex flex-col justify-between transition-all duration-300 group cursor-pointer`;
                        
                        card.onclick = () => handleCardClick(item);

                        const bgImageLayer = isImage ? `
                            <div class="absolute -right-6 -bottom-6 w-36 h-36 opacity-15 dark:opacity-10 pointer-events-none transition-transform duration-300 group-hover:scale-110">
                                <img src="${item.filename}" alt="" class="w-full h-full object-contain">
                            </div>
                        ` : '';

                        card.innerHTML = `
                            ${bgImageLayer}
                            <div class="relative z-10">
                                <div class="flex items-start justify-between gap-4 mb-4">
                                    <div class="relative w-14 h-14 rounded-2xl ${isPlaying ? 'bg-orange-600 text-white shadow-md shadow-orange-600/30' : 'bg-orange-100 dark:bg-slate-800 text-orange-700 dark:text-orange-400 group-hover:bg-orange-200 dark:group-hover:bg-slate-700'} flex items-center justify-center transition-all duration-200">
                                        ${isPlaying ? '<div class="absolute inset-0 rounded-2xl border-2 border-orange-300 playing-glow"></div>' : ''}
                                        <i class="fa-solid ${isImage ? 'fa-image fa-lg' : (isPlaying ? 'fa-pause fa-lg' : 'fa-play fa-lg ml-0.5')} z-10"></i>
                                    </div>
                                    
                                    <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border ${theme.badge}">
                                        ${escapeHTML(item.category)}
                                    </span>
                                </div>

                                <h3 class="text-base font-extrabold text-slate-900 dark:text-white mb-2 line-clamp-1 group-hover:text-orange-600 dark:group-hover:text-orange-400 transition-colors" title="${escapeHTML(item.title)}">
                                    ${escapeHTML(item.title)}
                                </h3>

                                <p class="text-xs font-medium text-slate-600 dark:text-slate-300 line-clamp-2 leading-relaxed mb-10" title="${escapeHTML(item.description)}">
                                    ${escapeHTML(item.description)}
                                </p>
                            </div>

                            <div class="absolute bottom-4 right-4 z-10" onclick="event.stopPropagation()">
                                <a href="${item.filename}" download="${escapeHTML(item.filename)}" 
                                   class="w-10 h-10 rounded-xl bg-orange-100 dark:bg-slate-800 hover:bg-orange-600 dark:hover:bg-orange-600 text-orange-700 dark:text-orange-300 hover:text-white border border-orange-200 dark:border-slate-700 flex items-center justify-center transition-all duration-200 shadow-sm"
                                   title="ファイルをダウンロード">
                                    <i class="fa-solid fa-download text-sm"></i>
                                </a>
                            </div>
                        `;

                        gridEl.appendChild(card);
                    });
                }
            });
        }

        function togglePlay(id) {
            const item = audioList.find(a => a.id === id);
            if (!item || item.type === 'image') return;

            if (currentPlayingId === id) {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                currentPlayingId = null;
            } else {
                if (currentAudio) { currentAudio.pause(); }

                currentAudio = new Audio(item.filename);
                currentAudio.volume = currentVolume;
                currentPlayingId = id;

                currentAudio.play().catch(err => {
                    console.error('Audio playback error:', err);
                    currentPlayingId = null;
                    renderCategories();
                });

                currentAudio.onended = () => {
                    currentPlayingId = null;
                    renderCategories();
                };
            }
            renderCategories();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        window.onload = () => {
            loadAudios();
            renderCategories();
        };
    </script>
</body>
</html>
